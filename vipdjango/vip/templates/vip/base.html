<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Virtual Caretaker{% endblock %}</title>
    <style>
        :root {
            --text: #172033;
            --bg: #eef2f7;
            --surface: #ffffff;
            --surface-soft: #f7f9fc;
            --border: #cbd5e1;
            --border-soft: #e2e8f0;
            --muted: #64748b;
            --accent: #2563eb;
            --accent-strong: #1d4ed8;
            --accent-soft: #dbeafe;
            --success: #047857;
            --success-soft: #d1fae5;
            --danger: #b91c1c;
            --danger-soft: #fee2e2;
            --warning: #b45309;
            --warning-soft: #fef3c7;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 28px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
        }

        .page {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: clamp(1.65rem, 2vw, 2.1rem);
            line-height: 1.15;
        }

        h2 {
            margin: 0 0 14px 0;
            font-size: 1.15rem;
            line-height: 1.25;
        }

        h3 {
            margin: 18px 0 10px 0;
            font-size: 1rem;
        }

        p {
            margin: 0 0 14px 0;
        }

        a {
            color: var(--accent-strong);
            text-underline-offset: 2px;
        }

        a:hover {
            color: #1e40af;
        }

        :focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.25);
            outline-offset: 2px;
        }

        .muted {
            color: var(--muted);
        }

        .page-header {
            margin-bottom: 18px;
        }

        .page-header p {
            max-width: 760px;
        }

        .content-card {
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 16px;
            background: var(--surface-soft);
            margin-bottom: 18px;
        }

        .panel {
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 18px;
            background: var(--surface);
            margin-bottom: 16px;
        }

        .panel.soft {
            background: var(--surface-soft);
        }

        .panel.narrow {
            max-width: 440px;
        }

        .panel h2 {
            margin-bottom: 10px;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .meta-item {
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 10px;
            background: var(--surface-soft);
        }

        .stack {
            display: grid;
            gap: 12px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 18px;
            overflow: hidden;
            border-radius: var(--radius);
        }

        th, td {
            border: 1px solid var(--border-soft);
            padding: 11px 12px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f1f5f9;
            color: #334155;
            font-size: 0.82rem;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        form {
            margin: 0;
        }

        label {
            font-weight: 650;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 9px 10px;
            color: var(--text);
            background: #ffffff;
            font: inherit;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
        }

        textarea {
            resize: vertical;
        }

        code {
            background: #e2e8f0;
            border-radius: 5px;
            padding: 1px 5px;
            font-size: 0.92em;
        }

        button,
        .button,
        .action-btn,
        .top-link,
        .tab-link,
        .tab-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #ffffff;
            color: var(--text);
            font: inherit;
            line-height: 1.2;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover,
        .button:hover,
        .action-btn:hover,
        .top-link:hover,
        .tab-link:hover,
        .tab-btn:hover {
            background: #f8fafc;
            color: var(--text);
        }

        .button.primary,
        button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff;
        }

        .button.primary:hover,
        button.primary:hover {
            background: var(--accent-strong);
            color: #ffffff;
        }

        .action-btn.danger,
        button.danger {
            border-color: #fecaca;
            background: #fff7f7;
            color: var(--danger);
        }

        .action-btn.danger:hover,
        button.danger:hover {
            background: var(--danger-soft);
        }

        .action-stack,
        .row-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .top-link,
        .top-nav button {
            min-height: 34px;
            font-size: 0.9rem;
            background: var(--surface-soft);
        }

        .tabs {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            margin: 8px 0 22px 0;
            max-width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: var(--surface-soft);
        }

        .tab-link,
        .tab-btn {
            border-color: transparent;
            background: transparent;
            white-space: nowrap;
        }

        .tab-link.active,
        .tab-btn.active {
            background: #ffffff;
            border-color: var(--border-soft);
            color: var(--accent-strong);
            font-weight: 700;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .subtabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 6px 0 16px 0;
        }

        .subtab-btn {
            min-height: 34px;
            padding: 7px 11px;
            border-radius: 999px;
            border: 1px solid var(--border-soft);
            background: #ffffff;
            color: #334155;
        }

        .subtab-btn.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 700;
        }

        .subtab-panel.is-hidden {
            display: none;
        }

        .dashboard-layout,
        .student-layout {
            display: grid;
            grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .prompt-select {
            margin-bottom: 10px;
        }

        .chat-window {
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 14px;
            min-height: 420px;
            max-height: 560px;
            overflow-y: auto;
            background: #f8fafc;
            margin-bottom: 14px;
        }

        .chat-message {
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 10px 12px;
            margin-bottom: 10px;
            background: #ffffff;
        }

        .chat-message.student {
            border-left: 4px solid var(--accent);
            background: #eff6ff;
        }

        .chat-message.assistant {
            border-left: 4px solid var(--success);
            background: var(--success-soft);
        }

        .chat-message.simulation {
            border-left: 4px solid #64748b;
            background: #f1f5f9;
        }

        .chat-speaker,
        .eyebrow {
            color: #475569;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .chat-speaker {
            margin-bottom: 2px;
        }

        .eyebrow {
            margin-bottom: 4px;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .chat-meta {
            color: var(--muted);
            font-size: 0.86rem;
            margin-bottom: 4px;
        }

        .pre-wrap {
            white-space: pre-wrap;
        }

        .message-form textarea {
            min-height: 92px;
            margin-bottom: 8px;
        }

        .compose-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 8px;
            align-items: end;
        }

        .text-compose-row {
            grid-template-columns: minmax(0, 1fr) auto;
        }

        .send-button-inline {
            height: 44px;
            padding: 0 16px;
        }

        .voice-status {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .conversation-heading,
        .transcript-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .conversation-heading {
            margin-bottom: 16px;
        }

        .conversation-heading h2,
        .transcript-heading h3,
        .mode-card h3 {
            margin: 0;
        }

        .scenario-briefing {
            margin: 14px 0 18px;
            padding: 14px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: var(--surface-soft);
        }

        .scenario-briefing p:last-child,
        .mode-card p:last-of-type {
            margin-bottom: 0;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .mode-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            min-height: 245px;
            padding: 20px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: #ffffff;
        }

        .mode-card p {
            flex: 1;
            color: var(--muted);
        }

        .mode-card button {
            width: 100%;
        }

        .mode-icon {
            font-size: 1.65rem;
        }

        .voice-call {
            display: block;
        }

        .call-duration {
            color: #475569;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .call-stage {
            position: relative;
            display: flex;
            min-height: 330px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            border-radius: var(--radius);
            background: linear-gradient(145deg, #eff6ff, #f8fafc 62%, #ecfdf5);
            text-align: center;
        }

        .call-orb {
            width: 78px;
            height: 78px;
            margin-bottom: 18px;
            border: 14px solid rgba(37, 99, 235, 0.14);
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 12px rgba(37, 99, 235, 0.07);
        }

        .voice-call[data-state="listening-"] .call-orb,
        .voice-call[data-state$="speaking-"] .call-orb {
            animation: call-pulse 1.6s ease-in-out infinite;
        }

        @keyframes call-pulse {
            50% { transform: scale(1.08); box-shadow: 0 0 0 22px rgba(37, 99, 235, 0.04); }
        }

        .call-status {
            display: block;
            margin-bottom: 4px;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .call-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .connection-lost {
            display: grid;
            justify-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 14px 18px;
            border: 1px solid #fecaca;
            border-radius: var(--radius);
            background: var(--danger-soft);
            color: #7f1d1d;
        }

        .connection-lost strong {
            font-size: 1.1rem;
        }

        .transcript-section {
            margin-top: 18px;
        }

        .transcript-heading {
            margin-bottom: 8px;
        }

        .voice-live-transcript {
            display: grid;
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
            padding: 14px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: #f8fafc;
        }

        .voice-transcript-message {
            display: grid;
            gap: 4px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #eff6ff;
        }

        .voice-transcript-message.agent {
            background: var(--success-soft);
        }

        .voice-transcript-message.tentative {
            color: var(--muted);
            font-style: italic;
        }

        .voice-transcript-message.simulation {
            border-left: 4px solid #64748b;
            background: #f1f5f9;
        }

        .voice-transcript-message strong {
            color: #475569;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
        }

        .session-actions {
            display: flex;
            gap: 10px;
        }

        .is-hidden {
            display: none !important;
        }

        .session-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .session-list li {
            border-bottom: 1px solid var(--border-soft);
            padding: 10px 0;
        }

        .session-list li:last-child {
            border-bottom: none;
        }

        .error-text,
        .errors {
            color: var(--danger);
            margin-bottom: 10px;
        }

        .flash-message {
            margin-bottom: 16px;
            padding: 11px 13px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: var(--surface-soft);
        }

        .flash-message.success {
            border-color: #86efac;
            background: var(--success-soft);
            color: var(--success);
        }

        .flash-message.error {
            border-color: #fecaca;
            background: var(--danger-soft);
            color: var(--danger);
        }

        .closed-banner {
            border: 1px solid #fbbf24;
            background: var(--warning-soft);
            color: var(--warning);
            border-radius: var(--radius);
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid var(--border-soft);
            background: var(--surface-soft);
            color: #334155;
            font-size: 0.86rem;
            font-weight: 650;
        }

        .status-pill.active {
            border-color: #86efac;
            background: #dcfce7;
            color: #166534;
        }

        .table-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .mb-10 {
            margin-bottom: 10px;
        }

        .mb-14 {
            margin-bottom: 14px;
        }

        .mt-6 {
            margin-top: 6px;
        }

        .mt-8 {
            margin-top: 8px;
        }

        @media (max-width: 960px) {
            body {
                padding: 14px;
            }

            .page {
                padding: 18px;
            }

            .dashboard-layout,
            .student-layout {
                grid-template-columns: 1fr;
            }

            .compose-row {
                grid-template-columns: 1fr;
            }

            .conversation-heading,
            .transcript-heading {
                align-items: stretch;
                flex-direction: column;
            }

            .mode-grid {
                grid-template-columns: 1fr;
            }

            .mode-card {
                min-height: 0;
            }

            .call-controls {
                display: grid;
                width: 100%;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .send-button-inline {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        {% block top_nav %}
        {% if request.user.is_authenticated %}
        <div class="top-nav">
            <a class="top-link" href="{% url 'vip:home' %}">Home</a>
            <a class="top-link" href="{% url 'vip:account_settings' %}">Account</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
        {% endif %}
        {% endblock %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
